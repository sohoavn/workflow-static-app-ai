<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Workflow-as-Application Platform - Create executable workflows with AI">
  <title>Workflow-as-App Platform</title>
  
  <!-- TailwindCSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body class="bg-gray-50 font-sans antialiased">
  
  <!-- Navigation -->
  <nav id="main-nav" class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        
        <!-- Logo -->
        <div class="flex items-center">
          <a href="#designer" class="flex items-center space-x-2">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
            </svg>
            <span class="text-xl font-bold text-gray-900 hidden sm:block">Workflow-as-App</span>
          </a>
        </div>
        
        <!-- Desktop Navigation -->
        <div class="hidden md:flex items-center space-x-6">
          <a href="#designer" class="nav-link text-gray-700 hover:text-blue-600 font-medium transition-colors">
            Designer
          </a>
          <a href="#generator" class="nav-link text-gray-700 hover:text-blue-600 font-medium transition-colors">
            Generator
          </a>
          <a href="#library" class="nav-link text-gray-700 hover:text-blue-600 font-medium transition-colors">
            Library
          </a>
          <a href="#settings" class="nav-link text-gray-700 hover:text-blue-600 font-medium transition-colors">
            Settings
          </a>
        </div>
        
        <!-- Mobile Menu Button -->
        <div class="md:hidden">
          <button id="mobile-menu-btn" class="text-gray-600 hover:text-gray-900 p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Mobile Menu (Hidden by default) -->
      <div id="mobile-menu" class="hidden md:hidden pb-4">
        <a href="#designer" class="block py-2 px-4 text-gray-700 hover:bg-gray-50 rounded">Designer</a>
        <a href="#generator" class="block py-2 px-4 text-gray-700 hover:bg-gray-50 rounded">Generator</a>
        <a href="#library" class="block py-2 px-4 text-gray-700 hover:bg-gray-50 rounded">Library</a>
        <a href="#settings" class="block py-2 px-4 text-gray-700 hover:bg-gray-50 rounded">Settings</a>
      </div>
    </div>
  </nav>
  
  <!-- Main Content Area (SPA loads here) -->
  <main id="app-content" class="min-h-screen">
    <!-- Page content will be loaded here dynamically -->
    <div class="container mx-auto px-4 py-8 text-center">
      <div class="animate-pulse">
        <div class="h-8 bg-gray-200 rounded w-48 mx-auto mb-4"></div>
        <div class="h-4 bg-gray-200 rounded w-64 mx-auto"></div>
      </div>
    </div>
  </main>
  
  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2">
    <!-- Toast notifications will be appended here -->
  </div>
  
  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 shadow-xl">
      <div class="flex items-center space-x-3">
        <svg class="animate-spin h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-gray-700 font-medium">Loading...</span>
      </div>
    </div>
  </div>
  
  <!-- CDN Libraries -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  
  <!-- App Scripts -->
  <script src="./assets/js/core/app.js" type="module"></script>
  
  <script>
    // Mobile menu toggle
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    });
    
    // Close mobile menu on link click
    document.querySelectorAll('#mobile-menu a').forEach(link => {
      link.addEventListener('click', () => {
        document.getElementById('mobile-menu').classList.add('hidden');
      });
    });
  </script>
</body>
</html>
